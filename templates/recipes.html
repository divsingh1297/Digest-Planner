{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="card">
    <h2>Recipes</h2>
    <div class="recipe-grid">
      {% for r in recipes %}
        <div class="recipe-card" title="{{ r.title }}">
          <div class="recipe-title">{{ r.title }}</div>
          <pre class="ingredients">{{ r.ingredients }}</pre>
        </div>
      {% else %}
        <p>No recipes yet. <a href="{{ url_for('add_recipe') }}">Add one</a></p>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
